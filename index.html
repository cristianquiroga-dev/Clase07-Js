<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulario</h1>

    <form id="formulario">
        <div>
            <label for="nombre">Ingrese su nombre:</label>
            <input type="text" id="nombre">
            <p id="salidadNombre"></p>
        </div>
        <div>
            <label for="edad">Ingrese su edad:</label>
            <input type="number" id="edad">
            <p id="salidaEdad"></p>
        </div>

        <div>
            <label for="experiencia">Seleccione el campo de experiencia</label>
            <select name="experiencia" id="experiencia">
                <option value="">Seleccione una opcion</option>
                <option value="principiante">Principiante</option>
                <option value="intermedio">Intermedio</option>
                <option value="avanzado">Avanzado</option>
            </select>
            <p id="salidaExp"></p>
        </div>

        <div>
            <label for="modalidad">Tipo de modalidad:</label>
            <select name="modalidad" id="modalidad">
                <option value="">Seleccione la modalidad</option>
                <option value="presencial">Presencial</option>
                <option value="virtual">Virtual</option>
                <option value="mixta">Mixta</option>
            </select>
            <p id="salidaModalidad"></p>
        </div>

        <div>
            <label for="correo">Ingrese el correo electronico:</label>
            <input type="email" id="correo">
            <p id="salidaCorreo"></p>
        </div>

        <button type="submit">Enviar</button>
        <p id="resultado"></p>

        
    </form>

    <script src="js/app.js"></script>
</body>
</html>
